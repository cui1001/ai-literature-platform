<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" font-family="Microsoft YaHei, Segoe UI, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b82"/>
    </marker>
    <marker id="arrowDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa7b8"/>
    </marker>
    <style>
      .box { fill: #f7f9fc; stroke: #c7d2e0; stroke-width: 1.2; rx: 8; }
      .box-blue { fill: #eef4ff; stroke: #8fb0e0; }
      .box-green { fill: #effaf3; stroke: #86c99f; }
      .box-gray { fill: #f3f4f6; stroke: #c9ced6; }
      .t { fill: #1f2937; font-size: 14px; }
      .tb { fill: #111827; font-size: 15px; font-weight: 700; }
      .ts { fill: #4b5563; font-size: 12px; }
      .tm { fill: #374151; font-size: 12.5px; }
      .chip { fill: #ffffff; stroke: #b9c6d8; rx: 5; }
      .line { stroke: #5b6b82; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #9aa7b8; stroke-width: 1.3; stroke-dasharray: 5 4; fill: none; marker-end: url(#arrowDash); }
      .label { fill: #6b7280; font-size: 11.5px; }
    </style>
  </defs>

  <rect width="1280" height="820" fill="#ffffff"/>

  <!-- 前端 -->
  <rect x="40" y="32" width="1200" height="112" class="box box-blue"/>
  <text x="60" y="60" class="tb">前端 SPA（原生 ES Module，零构建）</text>
  <text x="60" y="82" class="ts">hash 路由 · 8 个视图 · 直接消费 REST/JSON</text>
  <g>
    <rect x="60" y="96" width="118" height="30" class="chip"/><text x="76" y="116" class="tm">文献库</text>
    <rect x="188" y="96" width="118" height="30" class="chip"/><text x="204" y="116" class="tm">版式阅读</text>
    <rect x="316" y="96" width="118" height="30" class="chip"/><text x="332" y="116" class="tm">抗幻觉问答</text>
    <rect x="444" y="96" width="118" height="30" class="chip"/><text x="460" y="116" class="tm">arXiv 追踪</text>
    <rect x="572" y="96" width="118" height="30" class="chip"/><text x="588" y="116" class="tm">引用图谱</text>
    <rect x="700" y="96" width="118" height="30" class="chip"/><text x="716" y="116" class="tm">综述</text>
    <rect x="828" y="96" width="118" height="30" class="chip"/><text x="844" y="116" class="tm">写作</text>
    <rect x="956" y="96" width="118" height="30" class="chip"/><text x="972" y="116" class="tm">数据可视化</text>
    <rect x="1084" y="96" width="136" height="30" class="chip"/><text x="1100" y="116" class="tm">系统状态</text>
  </g>

  <!-- API -->
  <rect x="200" y="176" width="880" height="56" class="box"/>
  <text x="220" y="200" class="tb">FastAPI 应用 · 51 条 REST 接口</text>
  <text x="220" y="220" class="ts">api/{papers,reading,qa,discovery,graph,writing,dataviz,system} · 参数校验 / 错误翻译 / 响应整形 · 静态托管 SPA</text>
  <line x1="640" y1="144" x2="640" y2="174" class="line"/>

  <!-- 业务模块 3x3 -->
  <g>
    <rect x="40" y="264" width="270" height="72" class="box box-green"/>
    <text x="60" y="290" class="tb">parsing</text><text x="60" y="312" class="ts">版面块 / 表格 / 公式 / 参考文献 / OCR</text>

    <rect x="330" y="264" width="270" height="72" class="box box-green"/>
    <text x="350" y="290" class="tb">papers</text><text x="350" y="312" class="ts">上传 / 解析 / 去重 / 入库 / 版本</text>

    <rect x="620" y="264" width="270" height="72" class="box box-green"/>
    <text x="640" y="290" class="tb">indexing</text><text x="640" y="312" class="ts">分块 / meta 块 / BM25 / 向量 / RRF</text>

    <rect x="910" y="264" width="330" height="72" class="box box-green"/>
    <text x="930" y="290" class="tb">qa</text><text x="930" y="312" class="ts">单篇问答 / 9 维对比 / 锚点 / 校验</text>

    <rect x="40" y="352" width="270" height="72" class="box box-green"/>
    <text x="60" y="378" class="tb">reading</text><text x="60" y="400" class="ts">阅读装配 / 双向链接 / 翻译 / 四种导出</text>

    <rect x="330" y="352" width="270" height="72" class="box box-green"/>
    <text x="350" y="378" class="tb">discovery</text><text x="350" y="400" class="ts">arXiv 检索 / 追踪 / 推荐 / 反馈</text>

    <rect x="620" y="352" width="270" height="72" class="box box-green"/>
    <text x="640" y="378" class="tb">graph</text><text x="640" y="400" class="ts">引用图 / PageRank / 综述 / Future Work</text>

    <rect x="910" y="352" width="330" height="72" class="box box-green"/>
    <text x="930" y="378" class="tb">writing · dataviz</text><text x="930" y="400" class="ts">无幻觉大纲 / 图脚本 / 学术翻译 / SVG</text>
  </g>
  <line x1="640" y1="232" x2="640" y2="262" class="line"/>

  <!-- providers -->
  <rect x="40" y="464" width="560" height="104" class="box box-gray"/>
  <text x="60" y="490" class="tb">providers：能力网关（在线优先 / 离线降级）</text>
  <g>
    <rect x="60" y="504" width="120" height="44" class="chip"/><text x="74" y="522" class="tm">LLM</text><text x="74" y="540" class="ts">DeepSeek / 抽取式</text>
    <rect x="192" y="504" width="120" height="44" class="chip"/><text x="206" y="522" class="tm">Embedding</text><text x="206" y="540" class="ts">bge-m3 / hashing</text>
    <rect x="324" y="504" width="120" height="44" class="chip"/><text x="338" y="522" class="tm">OCR</text><text x="338" y="540" class="ts">winrt / tesseract</text>
    <rect x="456" y="504" width="124" height="44" class="chip"/><text x="470" y="522" class="tm">arXiv</text><text x="470" y="540" class="ts">Atom / 离线镜像</text>
  </g>

  <rect x="620" y="464" width="300" height="104" class="box box-gray"/>
  <text x="640" y="490" class="tb">core · db</text>
  <text x="640" y="514" class="ts">配置 / 日志 / 异常 / 哈希 / 文本工具</text>
  <text x="640" y="536" class="ts">SQLite 连接池（WAL）· 仓储函数</text>

  <rect x="940" y="464" width="300" height="104" class="box box-gray"/>
  <text x="960" y="490" class="tb">确定性与审计</text>
  <text x="960" y="514" class="ts">内容哈希 ID · 固定种子布局</text>
  <text x="960" y="536" class="ts">解析 JSON · 检索 trace · qa_log</text>

  <!-- 外部能力 -->
  <rect x="420" y="620" width="440" height="64" class="box"/>
  <text x="440" y="646" class="tb">外部服务（可选）</text>
  <text x="440" y="668" class="ts">DeepSeek Chat · SiliconFlow bge-m3 · export.arxiv.org</text>
  <line x1="320" y1="568" x2="470" y2="618" class="dash"/>
  <text x="300" y="600" class="label">HTTP / JSON</text>
  <text x="700" y="600" class="label">失败自动回落本地实现</text>
  <line x1="740" y1="568" x2="700" y2="618" class="dash"/>

  <!-- 存储 -->
  <rect x="40" y="716" width="1200" height="76" class="box"/>
  <text x="60" y="742" class="tb">持久层</text>
  <text x="60" y="766" class="ts">SQLite data/app.db（papers / sections / chunks / embeddings / refs / edges / translations / qa_log / graphs / surveys / outlines / datasets / charts …，共 20 张表）</text>
  <text x="60" y="784" class="ts">文件系统 data/papers（PDF）· data/pages（150 DPI PNG）· data/parsed（解析 JSON）· data/figures · data/artifacts（导出）</text>
  <line x1="300" y1="568" x2="300" y2="714" class="line"/>
  <line x1="900" y1="568" x2="900" y2="714" class="line"/>
</svg>
